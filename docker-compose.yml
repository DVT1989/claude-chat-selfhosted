# Fixed project name: container names (claude-chat-backend-1, ...), volumes and selfupdate depend on it,
# whatever the folder is called.
name: claude-chat

services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "${APP_PORT:-15980}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - claude-chat
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      - TZ=Europe/Amsterdam
      - NODE_ENV=production
      - HOSTNAME=0.0.0.0
      - PORT=3000
      - NEXTAUTH_URL=${APP_URL:-http://localhost:15980}
      - NEXTAUTH_SECRET=${JWT_SECRET}
    restart: unless-stopped
    networks:
      - claude-chat
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - APP_URL=${APP_URL:-http://localhost:15980}
      secrets:
        - codesign_key
        - codesign_crt
    environment:
      - TZ=Europe/Amsterdam
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgresql://${POSTGRES_USER:-claudechat}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-claudechat}
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - VAPID_PUBLIC_KEY=${VAPID_PUBLIC_KEY}
      - VAPID_PRIVATE_KEY=${VAPID_PRIVATE_KEY}
      - VAPID_SUBJECT=${VAPID_SUBJECT}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - CORS_ORIGIN=${APP_URL:-http://localhost:15980}
      - APP_URL=${APP_URL:-http://localhost:15980}
      - ONEDRIVE_CLIENT_ID=${ONEDRIVE_CLIENT_ID:-}
      - ONEDRIVE_CLIENT_SECRET=${ONEDRIVE_CLIENT_SECRET:-}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-}
      - CLAUDE_AI_EMAIL=${CLAUDE_AI_EMAIL:-}
      - CLAUDE_AI_PASSWORD=${CLAUDE_AI_PASSWORD:-}
      - PLAYWRIGHT_BROWSERS_PATH=/opt/playwright-browsers
      - NODE_OPTIONS=--dns-result-order=ipv4first
      - DOCKER_API_VERSION=1.43
      - PROJECT_DIR=${PROJECT_DIR:-/volume1/docker/claude-chat}
      - HOST_LABEL=${HOST_LABEL:-server}
      # optional cap for automatic agent updates (empty = always the newest version)
      - AGENT_AUTO_UPDATE_MAX=${AGENT_AUTO_UPDATE_MAX:-}
      - UPDATE_GITHUB_TOKEN=${UPDATE_GITHUB_TOKEN:-}
    volumes:
      - workspace_data:/workspace
      - home_data:/claude-homes
      - ./shared-skills:/shared-skills:ro
      - ./import:/import:ro
      - whatsapp_data:/data/whatsapp
      - browser_data:/data/browser
      - transfers_data:/data/transfers
      # Admin chat + backups: docker socket and project dir (only reachable with gid 0, see backend/Dockerfile)
      - /var/run/docker.sock:/var/run/docker.sock
      - ${PROJECT_DIR:-/volume1/docker/claude-chat}:${PROJECT_DIR:-/volume1/docker/claude-chat}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - claude-chat
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:4000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16-alpine
    environment:
      - TZ=Europe/Amsterdam
      - POSTGRES_USER=${POSTGRES_USER:-claudechat}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB:-claudechat}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    networks:
      - claude-chat
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-claudechat} -d ${POSTGRES_DB:-claudechat}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  redis:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - claude-chat
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5


# Self-signed code signing for the Claude Agent (Windows); the key stays on the host
secrets:
  codesign_key:
    file: ./signing/codesign.key
  codesign_crt:
    file: ./signing/codesign.crt

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  workspace_data:
    driver: local
  home_data:
    driver: local
  browser_data:
    driver: local
  transfers_data:
    driver: local
  whatsapp_data:
    driver: local

networks:
  claude-chat:
    driver: bridge
