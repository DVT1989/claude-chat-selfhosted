server {
    listen 80;
    server_name _;

    # Docker's internal DNS — re-resolve hostnames every 30s so container IP
    # changes after recreate are picked up automatically
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Increase timeouts for SSE streaming
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;

    # Forward real IP from upstream reverse proxy (Synology).
    # Trust only RFC-1918 private ranges so external clients can't spoof the header.
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Health check endpoint (nginx level)
    location = /health {
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # Backend API — strip /api/ prefix before forwarding
    location /api/ {
        set $backend "backend:4000";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$backend;
        proxy_http_version 1.1;

        # Required for SSE streaming
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        chunked_transfer_encoding on;

        # Tell upstream proxies (Synology Application Portal) not to buffer —
        # without this the Synology nginx drops the SSE body before it reaches
        # the browser.  'always' ensures the header is present on all status codes.
        add_header X-Accel-Buffering "no" always;

        # Disable gzip: compression requires buffering the full response first,
        # which breaks streaming and is pointless for already-small SSE frames.
        gzip off;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve upstream X-Forwarded-Proto (e.g. Synology HTTPS termination).
        # If empty (direct HTTP access), nginx omits the header and req.secure = false.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Cookie $http_cookie;

        proxy_pass_request_headers on;

        # Backend restarting (selfupdate): a JSON answer instead of nginx's HTML 502 page, so the app
        # can show "even opnieuw" and retry instead of a JSON parse error. Only nginx's own errors
        # (backend unreachable); real answers of the backend pass unchanged.
        error_page 502 503 504 = @api_down;
    }

    location @api_down {
        default_type application/json;
        add_header Retry-After 5 always;
        add_header Cache-Control "no-store" always;
        return 503 '{"error":"De server start even opnieuw. Een paar seconden geduld.","restarting":true}';
    }

    # Frontend (Next.js)
    location / {
        set $frontend "frontend:3000";
        proxy_pass http://$frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Next.js static files — aggressive caching
    location /_next/static/ {
        set $frontend "frontend:3000";
        proxy_pass http://$frontend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    client_max_body_size 50m;
}
